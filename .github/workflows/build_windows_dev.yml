name: Build SDR++ Windows Dev

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  BUILD_TYPE: Release

jobs:
  build_windows_dev:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        shell: pwsh
        run: cmake -E make_directory ${{ runner.workspace }}}/build

      - name: Download PothosSDR
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.myriadrf.org/builds/PothosSDR/PothosSDR-2020.01.26-vc14-x64.exe" -OutFile ${{ runner.workspace }}}/pothos.exe
          New-Item -ItemType Directory -Force -Path "C:/Program Files/PothosSDR" | Out-Null
          7z x ${{ runner.workspace }}}/pothos.exe -o"C:/Program Files/PothosSDR/"

      - name: Update libusb and librtlsdr
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/libusb/libusb/releases/download/v1.0.23/libusb-1.0.23.7z" -OutFile ${{ runner.workspace }}}/libusb.7z
          7z x ${{ runner.workspace }}}/libusb.7z -o${{ runner.workspace }}}/libusb_old
          Remove-Item "C:/Program Files/PothosSDR/bin/libusb-1.0.dll"
          Copy-Item "${{ runner.workspace }}}/libusb_old/MS64/dll/libusb-1.0.dll" "C:/Program Files/PothosSDR/bin/"
          Remove-Item "C:/Program Files/PothosSDR/lib/libusb-1.0.lib"
          Copy-Item "${{ runner.workspace }}}/libusb_old/MS64/dll/libusb-1.0.lib" "C:/Program Files/PothosSDR/lib/"
          Invoke-WebRequest -Uri "https://ftp.osmocom.org/binaries/windows/rtl-sdr/rtl-sdr-64bit-20240623.zip" -OutFile ${{ runner.workspace }}}/rtl-sdr.zip
          7z x ${{ runner.workspace }}}/rtl-sdr.zip -o${{ runner.workspace }}}/rtl-sdr
          Remove-Item "C:/Program Files/PothosSDR/bin/rtlsdr.dll"
          Copy-Item "${{ runner.workspace }}}/rtl-sdr/rtl-sdr-64bit-20240623/librtlsdr.dll" "C:/Program Files/PothosSDR/bin/rtlsdr.dll"

      - name: Install vcpkg dependencies
        shell: pwsh
        run: vcpkg install fftw3:x64-windows glfw3:x64-windows zstd:x64-windows libusb:x64-windows spdlog:x64-windows

      - name: Configure
        working-directory: ${{ runner.workspace }}}/build
        shell: pwsh
        run: |
          cmake "${{ github.workspace }}" -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DOPT_BUILD_AIRSPY_SOURCE=OFF -DOPT_BUILD_AIRSPYHF_SOURCE=OFF -DOPT_BUILD_AUDIO_SOURCE=OFF -DOPT_BUILD_BADGESDR_SOURCE=OFF -DOPT_BUILD_BLADERF_SOURCE=OFF -DOPT_BUILD_DRAGONLABS_SOURCE=OFF -DOPT_BUILD_HACKRF_SOURCE=OFF -DOPT_BUILD_HAROGIC_SOURCE=OFF -DOPT_BUILD_HERMES_SOURCE=OFF -DOPT_BUILD_HYDRASDR_SOURCE=OFF -DOPT_BUILD_KCSDR_SOURCE=OFF -DOPT_BUILD_LIMESDR_SOURCE=OFF -DOPT_BUILD_PERSEUS_SOURCE=OFF -DOPT_BUILD_PLUTOSDR_SOURCE=OFF -DOPT_BUILD_RFNM_SOURCE=OFF -DOPT_BUILD_RFSPACE_SOURCE=OFF -DOPT_BUILD_RTL_SDR_SOURCE=ON -DOPT_BUILD_RTL_TCP_SOURCE=ON -DOPT_BUILD_SDRPP_SERVER_SOURCE=OFF -DOPT_BUILD_SDRPLAY_SOURCE=OFF -DOPT_BUILD_SOAPY_SOURCE=OFF -DOPT_BUILD_SPECTRAN_SOURCE=OFF -DOPT_BUILD_SPECTRAN_HTTP_SOURCE=OFF -DOPT_BUILD_SPYSERVER_SOURCE=OFF -DOPT_BUILD_USRP_SOURCE=OFF -DOPT_BUILD_AUDIO_SINK=OFF -DOPT_BUILD_NETWORK_SINK=ON -DOPT_BUILD_ATV_DECODER=OFF -DOPT_BUILD_DAB_DECODER=OFF -DOPT_BUILD_FALCON9_DECODER=OFF -DOPT_BUILD_KG_SSTV_DECODER=OFF -DOPT_BUILD_M17_DECODER=OFF -DOPT_BUILD_METEOR_DEMODULATOR=OFF -DOPT_BUILD_PAGER_DECODER=OFF -DOPT_BUILD_RADIO=ON -DOPT_BUILD_RYFI_DECODER=OFF -DOPT_BUILD_VOR_RECEIVER=OFF -DOPT_BUILD_WEATHER_SAT_DECODER=OFF -DOPT_BUILD_DISCORD_PRESENCE=OFF -DOPT_BUILD_FREQUENCY_MANAGER=OFF -DOPT_BUILD_IQ_EXPORTER=OFF -DOPT_BUILD_RECORDER=OFF -DOPT_BUILD_RIGCTL_CLIENT=OFF -DOPT_BUILD_RIGCTL_SERVER=OFF -DOPT_BUILD_SCANNER=OFF -DOPT_BUILD_SCHEDULER=OFF -DOPT_BUILD_NEW_PORTAUDIO_SINK=OFF -DCOPY_MSVC_REDISTRIBUTABLES=ON -G "Visual Studio 17 2022" -A x64

      - name: Build
        working-directory: ${{ runner.workspace }}}/build
        shell: pwsh
        run: cmake --build . --config Release --verbose

      - name: Package development build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ${{ runner.workspace }}}/sdrpp_windows_dev/modules | Out-Null
          New-Item -ItemType Directory -Force -Path ${{ runner.workspace }}}/sdrpp_windows_dev/root | Out-Null
          Copy-Item -Recurse "root/*" "${{ runner.workspace }}/sdrpp_windows_dev/root/"
          Copy-Item "${{ runner.workspace }}/build/Release/sdrpp.exe" "${{ runner.workspace }}/sdrpp_windows_dev/"
          Copy-Item "${{ runner.workspace }}/build/Release/*.dll" "${{ runner.workspace }}/sdrpp_windows_dev/" -ErrorAction SilentlyContinue
          Copy-Item "${{ runner.workspace }}/build/source_modules/rtl_sdr_source/Release/rtl_sdr_source.dll" "${{ runner.workspace }}/sdrpp_windows_dev/modules/"
          Copy-Item "${{ runner.workspace }}/build/source_modules/rtl_tcp_source/Release/rtl_tcp_source.dll" "${{ runner.workspace }}/sdrpp_windows_dev/modules/"
          Copy-Item "${{ runner.workspace }}/build/sink_modules/network_sink/Release/network_sink.dll" "${{ runner.workspace }}/sdrpp_windows_dev/modules/"
          Copy-Item "C:/Program Files/PothosSDR/bin/rtlsdr.dll" "${{ runner.workspace }}/sdrpp_windows_dev/"
          Copy-Item "C:/Program Files/PothosSDR/bin/volk.dll" "${{ runner.workspace }}/sdrpp_windows_dev/"
          Copy-Item "C:/Program Files/PothosSDR/bin/libusb-1.0.dll" "${{ runner.workspace }}/sdrpp_windows_dev/"
          Copy-Item "C:/Program Files/PothosSDR/bin/pthreadVC2.dll" "${{ runner.workspace }}/sdrpp_windows_dev/"
          Compress-Archive -Path "${{ runner.workspace }}/sdrpp_windows_dev/*" -DestinationPath "${{ runner.workspace }}/sdrpp_windows_dev.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdrpp_windows_dev
          path: ${{ runner.workspace }}/sdrpp_windows_dev.zip
